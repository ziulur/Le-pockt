name: Montar aplicativos
on:
  push:
    branches: [main, 'melhoria/**']
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Versões
        run: python --version && node --version
      - name: Build (falha se faltar arquivo ou se a versão publicada não bater com src/)
        run: python tools/build.py --check
      - name: Testes de regressão
        run: node tests/run-all.js
      - name: Conteúdo gerado
        run: cat dist/MANIFEST.txt
      - name: Pacote do Windows
        run: cd dist/windows && zip -qr ../LE-Pocket-Windows.zip . && cd .. && unzip -l LE-Pocket-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/
          if-no-files-found: error
  android:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copia o emulador montado para o app
        run: test -s dist/web/LE-Pocket.html && mkdir -p android/app/src/main/assets && cp dist/web/LE-Pocket.html android/app/src/main/assets/index.html
      - run: gradle -p android assembleDebug --no-daemon
      - name: Confere o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LE-Pocket.apk && unzip -l LE-Pocket.apk | grep -E "assets/index.html|classes.dex|AndroidManifest.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: LE-Pocket.apk
          if-no-files-found: error
  ios:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - name: Versões
        run: xcodebuild -version
      - run: brew install xcodegen && xcodegen --version
      - name: Copia o emulador montado para o app
        run: test -s dist/web/LE-Pocket.html && mkdir -p ios/www && cp dist/web/LE-Pocket.html ios/www/index.html
      - run: cd ios && xcodegen generate
      - run: cd ios && xcodebuild -project LEPocket.xcodeproj -scheme LEPocket -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Monta e confere o IPA (sem assinatura)
        run: |
          test -f ios/build/Build/Products/Release-iphoneos/LEPocket.app/www/index.html
          mkdir Payload
          cp -R ios/build/Build/Products/Release-iphoneos/LEPocket.app Payload/
          zip -qr LE-Pocket.ipa Payload
          unzip -l LE-Pocket.ipa | grep -E "LEPocket.app/(LEPocket|Info.plist|www/index.html)"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: LE-Pocket.ipa
          if-no-files-found: error
  publicar:
    needs: [web, android, ios]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Junta os arquivos
        run: |
          mkdir saida
          cp art/android/LE-Pocket.apk art/ios/LE-Pocket.ipa art/web/LE-Pocket-Windows.zip saida/
          cp art/web/web/LE-Pocket.html saida/LE-Pocket.html
          ls -la saida
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete baixar --yes --cleanup-tag || true
          sleep 3
          gh release create baixar saida/* --target main --title "LE Pocket" --notes "Android: LE-Pocket.apk (debug, sem loja). iPhone: LE-Pocket.ipa sem assinatura (precisa de uma ferramenta de instalação que assine). Windows: LE-Pocket-Windows.zip. Navegador: LE-Pocket.html. Os jogos não vêm incluídos."
